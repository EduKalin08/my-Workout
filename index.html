<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Meu Treino"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Meu Treino • Progressão</title><style>
:root{color-scheme:dark;--bg:#10141c;--panel:#1a202b;--panel2:#222a38;--ink:#f4f6fa;--muted:#a9b4c5;--line:#343d4c;--accent:#c5f36b;--green:#c5f36b;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}main{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin:0}h1{font-size:33px;letter-spacing:-1.6px;line-height:1.1}h2{font-size:25px;letter-spacing:-.6px}h3{font-size:17px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.muted,small{color:var(--muted)}small{font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.intro{margin:8px 0 20px;color:var(--muted)}.day{display:flex;text-align:left;align-items:center;width:100%;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px 13px;color:var(--ink);margin:10px 0;min-height:84px}.day strong{display:block;font-size:18px}.day .info{flex:1}.day .info span{display:block;font-size:13px;color:var(--muted)}.day .tag{display:grid;place-items:center;width:50px;height:50px;background:var(--panel2);border-radius:13px;font-weight:800;color:var(--accent);font-size:13px}.arrow{font-size:25px;color:var(--accent)}.btn{border:0;border-radius:13px;min-height:48px;padding:12px 16px;background:var(--accent);color:#142008;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.danger{color:var(--red);background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}.wide{width:100%}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.panel{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:17px;margin:14px 0}.progress{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:10px 0}.progress div{background:var(--accent);height:100%;transition:width .2s}.group{color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.sethead,.setrow{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}.sethead{font-size:12px;color:var(--muted);margin-top:17px;margin-bottom:6px}.setrow{margin:9px 0}.setnum{color:var(--muted);font-weight:800;text-align:center}.field{min-width:0}.field input{width:100%;height:49px;border:1px solid var(--line);border-radius:11px;background:#101620;color:var(--ink);padding:8px 10px;font-size:18px;appearance:none;-webkit-appearance:none}.field small{display:block;margin:3px 0 0;white-space:nowrap;font-size:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.metric{background:var(--panel2);padding:12px;border-radius:12px;min-width:0}.metric strong{display:block;font-size:22px;letter-spacing:-.7px;overflow-wrap:anywhere}.metric span{font-size:12px;color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}.notice{background:#222b21;border:1px solid #405337;border-radius:12px;color:#dbecc4;padding:10px 12px;font-size:13px;margin:12px 0}.listbutton{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);padding:12px 0;min-height:48px}.listbutton:first-of-type{margin-top:8px}.status{font-size:12px;color:var(--muted);white-space:nowrap}.done{color:var(--green)}.current{color:var(--accent)}.footer{font-size:12px;color:var(--muted);margin:18px 0;text-align:center}.error{color:var(--red);font-size:13px;margin:8px 0}.historyitem{border-top:1px solid var(--line);padding:12px 0}.historyitem:first-of-type{border:0}.historyitem summary{cursor:pointer}.historyitem p{font-size:13px;color:var(--muted);margin-top:4px}.spaced{margin-top:14px}.hidden{display:none!important}#file{display:none}a{color:var(--accent)}@media(min-width:500px){main{padding-left:24px;padding-right:24px}}
</style></head><body><main id="app"></main><input id="file" type="file" accept="application/json,.json"><script>
'use strict';
const ex=(id,name,sets)=>({id,name,sets});
const chest=[ex('inclinado','Supino inclinado',4),ex('voador','Voador',3),ex('cross','Crossover de cima para baixo',3),ex('crossup','Crossover de baixo para cima',2)];
const shoulder=[ex('desenvolvimento','Desenvolvimento',4),ex('lateral','Elevação lateral',5)];
const tri=[ex('tri_polia','Tríceps na polia',4),ex('frances','Tríceps francês',4),ex('coice','Tríceps coice',3)];
const back=[ex('puxada','Puxada alta — pegada neutra',3),ex('curvada','Remada curvada — pegada supinada',3),ex('cavalinho','Cavalinho — pegada aberta',3),ex('pulldown','Pulldown',3)];
const bi=[ex('rosca_inc','Rosca inclinada',2),ex('scott','Rosca Scott',2),ex('hercules','Rosca Hércules',2),ex('martelo','Rosca martelo',2)];
const abs=[ex('abs','Abdominal na máquina',3)];
const legs=[ex('agachamento','Agachamento',4),ex('extensora','Extensora',4),ex('legpress','Leg press',3),ex('mesa','Mesa flexora',3),ex('cadeira_f','Cadeira flexora',3),ex('adutora','Cadeira adutora',3)];
const grp=(name,items)=>items.map(x=>({...x,group:name}));
const days=[{id:'seg',short:'SEG',name:'Segunda-feira',desc:'Peito · Ombros · Tríceps',ex:[...grp('Peito',chest),...grp('Ombros',shoulder),...grp('Tríceps',tri)]},{id:'ter',short:'TER',name:'Terça-feira',desc:'Costas · Bíceps · Abdômen',ex:[...grp('Costas',back),...grp('Bíceps',bi),...grp('Abdômen',abs)]},{id:'qua',short:'QUA',name:'Quarta-feira',desc:'Pernas',ex:grp('Pernas',legs)},{id:'qui',short:'QUI',name:'Quinta-feira',desc:'Tríceps · Ombros · Peito',ex:[...grp('Tríceps',tri),...grp('Ombros',shoulder),...grp('Peito',chest)]},{id:'sex',short:'SEX',name:'Sexta-feira',desc:'Bíceps · Costas · Abdômen',ex:[...grp('Bíceps',bi),...grp('Costas',back),...grp('Abdômen',abs)]}];
const KEY='meu-treino-iphone-v1';let state={version:1,sessions:[]}, storageOK=true;try{const s=localStorage.getItem(KEY);if(s){const parsed=JSON.parse(s);if(parsed.version===1&&Array.isArray(parsed.sessions))state=parsed;else throw Error('Formato inválido');}}catch(e){storageOK=false;}
const app=document.getElementById('app');let active=null,idx=0,view='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;const warn=document.getElementById('storagewarn');if(warn)warn.textContent='Não foi possível salvar neste navegador. Exporte o backup antes de sair.';} }
const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(n);const date=s=>new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});const getday=id=>days.find(d=>d.id===id);const current=()=>state.sessions.find(s=>s.id===active);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const number=s=>String(s??'').trim()===''?NaN:Number(String(s).replace(',','.'));
const valid=r=>r&&Number.isFinite(number(r.kg))&&number(r.kg)>=0&&Number.isInteger(number(r.reps))&&number(r.reps)>0;
function totals(rows){return rows.reduce((a,r)=>valid(r)?{kg:a.kg+number(r.kg),vol:a.vol+number(r.kg)*number(r.reps),reps:a.reps+number(r.reps),count:a.count+1}:a,{kg:0,vol:0,reps:0,count:0});}
function prev(s,e){return state.sessions.filter(t=>t.day===s.day&&t.id!==s.id&&t.created<s.created&&t.records[e.id]?.done).sort((a,b)=>b.created.localeCompare(a.created))[0]||null;}
function header(sub,title,back=false){return `<header class="top"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div>${back?'<button class="btn secondary" onclick="home()">Início</button>':'<button class="btn secondary" onclick="historyView()">Histórico</button>'}</header>`;}
function home(){view='home';active=null;app.innerHTML=header('Registro de musculação','Meu treino')+`<p class="intro">Escolha seu dia. A comparação é sempre com o último registro do <strong>mesmo dia da semana.</strong></p>`+days.map(d=>{const ss=state.sessions.filter(s=>s.day===d.id).sort((a,b)=>b.created.localeCompare(a.created));const draft=ss.find(s=>!s.finished);const last=ss.find(s=>s.finished);return `<button class="day" onclick="start('${d.id}')"><span class="tag">${d.short}</span><span class="info"><strong>${d.name}</strong><span>${d.desc}</span><span>${draft?'Treino em andamento • continuar':last?'Último treino: '+date(last.created):d.ex.length+' exercícios · '+d.ex.reduce((a,e)=>a+e.sets,0)+' séries'}</span></span><span class="arrow">›</span></button>`;}).join('')+`<section class="panel"><h3>Seus dados</h3><p class="muted" style="font-size:13px;margin:6px 0 12px">Registros salvos neste aparelho e navegador. Exporte um backup para não perder seu histórico.</p><div class="row"><button class="btn secondary" onclick="exportData()">Exportar backup</button><button class="btn secondary" onclick="document.getElementById('file').click()">Importar</button></div></section><p class="footer" id="storagewarn">${storageOK?'Armazenamento local • sem conta ou servidor':'Armazenamento indisponível. Faça backup antes de sair.'}</p>`;window.scrollTo(0,0);}
function start(day){let s=state.sessions.find(s=>s.day===day&&!s.finished);if(!s){s={id:Date.now()+'-'+Math.random().toString(36).slice(2),day,created:new Date().toISOString(),finished:null,records:{},idx:0};state.sessions.push(s);save();}active=s.id;idx=Math.min(s.idx||0,getday(day).ex.length-1);render();}
function signed(n){return (n>0?'+':n<0?'−':'')+fmt(Math.abs(n))+' kg';}function cls(n){return n>0?'pos':n<0?'neg':'';}
function metrics(s,e,r){const last=prev(s,e),a=totals(r.rows);if(a.count!==e.sets)return `<div class="notice">Preencha as ${e.sets} séries para calcular a evolução. ${a.count}/${e.sets} completas.</div>`;if(!last)return `<div class="metrics"><div class="metric"><span>Soma das cargas</span><strong>${fmt(a.kg)} kg</strong></div><div class="metric"><span>Volume (kg × reps)</span><strong>${fmt(a.vol)} kg</strong></div></div><div class="notice">Primeiro registro deste exercício neste dia. Ele será sua referência para o próximo treino.</div>`;const b=totals(last.records[e.id].rows);return `<div class="metrics"><div class="metric"><span>Diferença na soma das cargas</span><strong class="${cls(a.kg-b.kg)}">${signed(a.kg-b.kg)}</strong><small>${fmt(b.kg)} → ${fmt(a.kg)} kg</small></div><div class="metric"><span>Diferença no volume (kg × reps)</span><strong class="${cls(a.vol-b.vol)}">${signed(a.vol-b.vol)}</strong><small>${fmt(b.vol)} → ${fmt(a.vol)} kg</small></div></div><small>Comparado com ${getday(s.day).name.toLowerCase()}, ${date(last.created)}. ${a.reps} reps hoje · ${b.reps} antes.</small>`;}
function render(){view='work';const s=current(),d=getday(s.day),e=d.ex[idx];s.idx=idx;let r=s.records[e.id];if(!r){r={rows:Array.from({length:e.sets},()=>({kg:'',reps:''})),done:false};s.records[e.id]=r;}save();const last=prev(s,e),prior=last?.records[e.id].rows;const count=d.ex.filter(x=>s.records[x.id]?.done).length;app.innerHTML=header(d.short+' • '+date(s.created),d.name,true)+`<div class="row"><small>${count}/${d.ex.length} exercícios registrados</small><small style="text-align:right">${Math.round(count/d.ex.length*100)}%</small></div><div class="progress"><div style="width:${count/d.ex.length*100}%"></div></div><section class="panel"><div class="group">${e.group} · ${idx+1} de ${d.ex.length}</div><h2>${e.name}</h2><p class="muted" style="font-size:13px;margin-top:6px">${e.sets} séries · ${last?'Último registro: '+date(last.created):'Sem registro anterior neste dia'}</p>${last?'<button class="btn secondary wide spaced" onclick="copyPrevious()">Copiar cargas e reps anteriores</button>':''}<div class="sethead"><span>Série</span><span>Peso (kg)</span><span>Repetições</span></div>${r.rows.map((x,i)=>`<div class="setrow"><span class="setnum">${i+1}</span><div class="field"><input aria-label="Peso série ${i+1}" inputmode="decimal" type="text" value="${esc(x.kg)}" placeholder="0" oninput="change(${i},'kg',this.value)"><small>${prior?'Anterior: '+fmt(number(prior[i].kg))+' kg':'—'}</small></div><div class="field"><input aria-label="Repetições série ${i+1}" inputmode="numeric" type="text" value="${esc(x.reps)}" placeholder="0" oninput="change(${i},'reps',this.value)"><small>${prior?'Anterior: '+fmt(number(prior[i].reps))+' reps':'—'}</small></div></div>`).join('')}<small>Use sempre o mesmo critério de carga (por halter ou total) em cada exercício. Aceita vírgula decimal.</small><div id="metrics">${metrics(s,e,r)}</div><div id="err" class="error" role="alert"></div><button id="complete" class="btn wide spaced" onclick="complete()" ${r.rows.every(valid)?'':'disabled'}>${r.done?'Atualizar registro':'Salvar exercício e ver evolução'}</button><p id="saved" class="muted spaced" style="font-size:13px">${r.done?'✓ Exercício registrado.':''}</p><div class="row spaced"><button class="btn secondary" onclick="go(${idx-1})" ${idx===0?'disabled':''}>‹ Anterior</button><button class="btn secondary" onclick="go(${idx+1})" ${idx===d.ex.length-1?'disabled':''}>Próximo ›</button></div></section><section class="panel"><h3>Ordem do treino</h3>${d.ex.map((x,i)=>`<button class="listbutton" onclick="go(${i})"><span>${i+1}. ${x.name}<br><small>${x.group} · ${x.sets} séries</small></span><span class="status ${s.records[x.id]?.done?'done':i===idx?'current':''}">${s.records[x.id]?.done?'✓ Salvo':i===idx?'Atual':'Pendente'}</span></button>`).join('')}</section><button class="btn wide" onclick="finish()">Finalizar treino</button><button class="btn danger wide spaced" onclick="discard()">Descartar treino em andamento</button><p class="footer" id="storagewarn">${storageOK?'Rascunho salvo automaticamente':'Não foi possível salvar. Exporte um backup.'}</p>`;window.scrollTo(0,0);}
function change(i,k,v){const s=current(),e=getday(s.day).ex[idx],r=s.records[e.id];r.rows[i][k]=v;r.done=false;save();document.getElementById('metrics').innerHTML=metrics(s,e,r);document.getElementById('complete').disabled=!r.rows.every(valid);document.getElementById('complete').textContent='Salvar exercício e ver evolução';document.getElementById('saved').textContent='';document.getElementById('err').textContent='';}
function copyPrevious(){const s=current(),e=getday(s.day).ex[idx],p=prev(s,e);if(!p)return;const r=s.records[e.id];if(r.rows.some(x=>x.kg!==''||x.reps!=='')&&!confirm('Substituir os valores atuais pelos do treino anterior?'))return;r.rows=p.records[e.id].rows.map(x=>({...x}));r.done=false;save();render();}
function complete(){const s=current(),e=getday(s.day).ex[idx],r=s.records[e.id];if(!r.rows.every(valid))return;r.done=true;r.savedAt=new Date().toISOString();save();render();document.getElementById('saved').textContent='✓ Exercício registrado. Confira a evolução acima e avance para o próximo.';document.getElementById('metrics').scrollIntoView({block:'center',behavior:'smooth'});}
function go(i){const s=current(),d=getday(s.day);if(i<0||i>=d.ex.length)return;idx=i;render();}
function finish(){const s=current(),d=getday(s.day);const missing=d.ex.filter(e=>!s.records[e.id]?.done);if(missing.length){if(!confirm('Ainda há '+missing.length+' exercício(s) não salvo(s). Finalizar apenas os registros concluídos?'))return;if(missing.length===d.ex.length){alert('Salve pelo menos um exercício antes de finalizar.');return;}}s.finished=new Date().toISOString();save();summary(s);}
function summary(s){view='summary';const d=getday(s.day);app.innerHTML=header('Treino finalizado',d.name,true)+`<p class="intro">${date(s.created)} · ${d.ex.filter(e=>s.records[e.id]?.done).length}/${d.ex.length} exercícios registrados</p>`+d.ex.filter(e=>s.records[e.id]?.done).map(e=>`<section class="panel"><div class="group">${e.group}</div><h3>${e.name}</h3>${metrics(s,e,s.records[e.id])}</section>`).join('')+`<button class="btn wide" onclick="home()">Voltar ao início</button>`;window.scrollTo(0,0);}
function discard(){if(!confirm('Descartar este treino e todos os registros feitos nele? O histórico anterior será mantido.'))return;state.sessions=state.sessions.filter(s=>s.id!==active);save();home();}
function historyView(){view='history';app.innerHTML=header('Seus registros','Histórico',true)+`<p class="intro">Consulte as sessões separadas por dia da semana.</p>`+days.map(d=>{const list=state.sessions.filter(s=>s.day===d.id&&Object.values(s.records).some(r=>r.done)).sort((a,b)=>b.created.localeCompare(a.created));return `<section class="panel"><h3>${d.name}</h3>${list.length?list.map(s=>`<details class="historyitem"><summary>${date(s.created)} · ${s.finished?'Finalizado':'Em andamento'}</summary>${d.ex.filter(e=>s.records[e.id]?.done).map(e=>{const r=s.records[e.id],a=totals(r.rows);return `<p><strong>${e.name}</strong><br>${r.rows.map(x=>fmt(number(x.kg))+' kg × '+number(x.reps)).join(' · ')}<br>Cargas: ${fmt(a.kg)} kg | Volume: ${fmt(a.vol)} kg</p>`;}).join('')}<button class="btn secondary wide spaced" onclick="${s.finished?'openSummary':'resume'}('${esc(s.id)}')">${s.finished?'Ver evolução':'Continuar treino'}</button></details>`).join(''):'<p class="muted spaced">Nenhum registro.</p>'}</section>`;}).join('');window.scrollTo(0,0);}
function openSummary(id){const s=state.sessions.find(x=>x.id===id);if(s)summary(s);}function resume(id){active=id;idx=current().idx||0;render();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-treino-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validate(data){if(data?.version!==1||!Array.isArray(data.sessions))return false;const ids=new Set();return data.sessions.every(s=>{const d=getday(s.day);if(!d||typeof s.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(s.id)||ids.has(s.id)||typeof s.created!=='string'||!Number.isFinite(Date.parse(s.created))||!(s.finished===null||typeof s.finished==='string'&&Number.isFinite(Date.parse(s.finished)))||!s.records||typeof s.records!=='object'||!Number.isInteger(s.idx)||s.idx<0||s.idx>=d.ex.length)return false;ids.add(s.id);return Object.entries(s.records).every(([id,r])=>{const e=d.ex.find(x=>x.id===id);return e&&typeof r.done==='boolean'&&Array.isArray(r.rows)&&r.rows.length===e.sets&&r.rows.every(x=>x&&['string','number'].includes(typeof x.kg)&&['string','number'].includes(typeof x.reps)&&(!r.done||valid(x)));});});}
document.getElementById('file').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(!validate(data))throw Error('Arquivo inválido');if(confirm('Importar '+data.sessions.length+' sessão(ões)? Os registros deste aparelho serão substituídos pelo backup.')){state=data;save();home();}}catch(e){alert('Não foi possível importar. Use um backup válido do Meu Treino.');}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});home();
</script></body></html>
